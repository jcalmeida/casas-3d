<title>Casa T1 em 3D</title>

<style>
/* Layout: one full-screen 3D stage; a slim control bar on top, a measurement strip at the bottom. */
:root {
  --bg: #e9edf1;
  --panel: rgba(250, 251, 252, 0.92);
  --fg: #1b2430;
  --muted: #5d6b7c;
  --line: #c8d0d9;
  --accent: #2f4a6d;
  --accent-fg: #ffffff;
  --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a21; --panel: rgba(28, 35, 44, 0.92); --fg: #e6ebf1; --muted: #93a1b2;
    --line: #34404e; --accent: #8fb0d9; --accent-fg: #0f1720; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141a21; --panel: rgba(28, 35, 44, 0.92); --fg: #e6ebf1; --muted: #93a1b2;
  --line: #34404e; --accent: #8fb0d9; --accent-fg: #0f1720; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); overflow: hidden; }
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; outline: none; }
.bar {
  position: fixed; left: 0; right: 0; z-index: 2;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  padding-inline: 16px; pointer-events: none;
}
.bar > * { pointer-events: auto; }
.top { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 12px); justify-content: space-between; }
.bottom { bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); justify-content: space-between; }
.name { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; line-height: 1.25; }
.name b { font-weight: 600; letter-spacing: 0.02em; }
.name span { display: block; font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button, .chip {
  font: 500 13px var(--sans); color: var(--fg); background: transparent; border: 0;
  border-radius: 6px; padding: 7px 12px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.seg button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip { background: var(--panel); border: 1px solid var(--line); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.hint { font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-width: 100%; }
.hint .m { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--fg); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.credit { flex-basis: 100%; margin: 0; font-size: 10px; color: var(--muted); text-align: right; }
[hidden] { display: none !important; }
#err { position: fixed; inset: auto 16px 50% 16px; text-align: center; color: var(--muted); }
</style>

<div id="stage"></div>
<div class="bar top">
  <div class="name"><b>Casa em 3D</b><span>T1 · planta aproximada</span></div>
  <div class="seg" role="group" aria-label="Vista">
    <button id="v-aerial" aria-pressed="true">Aérea</button>
    <button id="v-plan" aria-pressed="false">Planta</button>
    <button id="v-walk" aria-pressed="false">Passear</button>
  </div>
</div>
<div class="bar bottom">
  <div class="hint" id="hint"></div>
  <div class="tools">
    <div class="seg" role="group" aria-label="Mobília" id="furn-seg"></div>
    <button class="chip" id="t-ad" aria-pressed="false">Planta do anúncio</button>
  </div>
</div>
<p id="err" hidden>Não foi possível iniciar o 3D neste dispositivo.</p>

new MutationObserver(setSky).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// --- bounds
let minX = Infinity, minZ = Infinity, maxX = -Infinity, maxZ = -Infinity;
for (const w of DATA.walls) for (const [x, z] of [[w[0], w[1]], [w[2], w[3]]]) {
  minX = Math.min(minX, x); maxX = Math.max(maxX, x); minZ = Math.min(minZ, z); maxZ = Math.max(maxZ, z);
}
const cx = (minX + maxX) / 2 * M, cz = (minZ + maxZ) / 2 * M;
const span = Math.max(maxX - minX, maxZ - minZ) * M;

// --- lights
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f72, 0.75));
const sun = new THREE.DirectionalLight(0xfff4e6, 0.65);
sun.position.set(cx - 8, 18, cz + 10);
sun.target.position.set(cx, 0, cz);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 50 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

// --- materials
const mat = {
  wall: new THREE.MeshStandardMaterial({ color: 0xf1efea, roughness: 0.9 }),
  rail: new THREE.MeshStandardMaterial({ color: 0x9fb6c8, roughness: 0.2, transparent: true, opacity: 0.45 }),
  glass: new THREE.MeshStandardMaterial({ color: 0xa9cbe6, roughness: 0.05, transparent: true, opacity: 0.28, side: THREE.DoubleSide }),
  front: new THREE.MeshStandardMaterial({ color: 0x5a4636, roughness: 0.7 }),
};
const floorColor = (n) => /^(Varanda|Zona)/.test(n) ? 0xa0785a : n.startsWith('WC') ? 0xd6d6d1 : 0xc9a27a;

// --- walls, split around openings; collision segments for walk mode
const solids = []; // [x1,z1,x2,z2] in metres
const walls = new THREE.Group();
function box(len, h, t, y0, along, w, material) {
  const [x1, z1, x2, z2] = w;
  const L = Math.hypot(x2 - x1, z2 - z1), ux = (x2 - x1) / L, uz = (z2 - z1) / L;
  const g = new THREE.Mesh(new THREE.BoxGeometry(len * M, h * M, t * M), material);
  const mid = along + len / 2;
  g.position.set((x1 + ux * mid) * M, (y0 + h / 2) * M, (z1 + uz * mid) * M);
  g.rotation.y = -Math.atan2(uz, ux);
  g.castShadow = g.receiveShadow = material !== mat.glass;
  walls.add(g);
  return [ux, uz];
}
for (const w of DATA.walls) {
  const [x1, z1, x2, z2, t, h, ops] = w;
  const L = Math.hypot(x2 - x1, z2 - z1);
  const isRail = h < DATA.H;
  // extend by half the thickness so corners close
  const ext = isRail ? 0 : t / 2;
  const ux = (x2 - x1) / L, uz = (z2 - z1) / L;
  const W = [x1 - ux * ext, z1 - uz * ext, x2 + ux * ext, z2 + uz * ext];
  const LL = L + 2 * ext;
  let cur = 0;
  const cuts = ops.map(([k, a, b]) => [k, a + ext, b + ext]);
  for (const [k, a, b] of cuts) {
    if (a > cur) { box(a - cur, h, t, 0, cur, W, isRail ? mat.rail : mat.wall); solids.push(seg(W, cur, a)); }
    box(b - a, h - OPEN_TOP, t, OPEN_TOP, a, W, mat.wall);
    if (k === 'window') { box(b - a, SILL, t, 0, a, W, mat.wall); box(b - a, OPEN_TOP - SILL, 2, SILL, a, W, mat.glass); solids.push(seg(W, a, b)); }
    else if (k === 'front') box(b - a, OPEN_TOP, 4, 0, a, W, mat.front), solids.push(seg(W, a, b));
    else if (k !== 'door' && k !== 'sdoor') { box(b - a, OPEN_TOP, 2, 0, a, W, mat.glass); }
    cur = b;
  }
  if (cur < LL) { box(LL - cur, h, t, 0, cur, W, isRail ? mat.rail : mat.wall); solids.push(seg(W, cur, LL)); }
}
function seg(W, a, b) {
  const [x1, z1, x2, z2] = W, L = Math.hypot(x2 - x1, z2 - z1), ux = (x2 - x1) / L, uz = (z2 - z1) / L;
  return [(x1 + ux * a) * M, (z1 + uz * a) * M, (x1 + ux * b) * M, (z1 + uz * b) * M];
}
scene.add(walls);

// --- floors + labels
const floors = new THREE.Group(), labels = new THREE.Group();
for (const [name, area, pts] of DATA.rooms) {
  const s = new THREE.Shape(pts.map(([x, z]) => new THREE.Vector2(x * M, z * M)));
  const f = new THREE.Mesh(new THREE.ShapeGeometry(s), new THREE.MeshStandardMaterial({ color: floorColor(name), roughness: 0.85, side: THREE.DoubleSide }));
  f.rotation.x = Math.PI / 2; f.receiveShadow = true;
  floors.add(f);
  let ax = 0, az = 0; for (const [x, z] of pts) { ax += x; az += z; }
  labels.add(label(name, area == null ? '' : area + ' m²', ax / pts.length * M, az / pts.length * M, /^(Varanda|Zona)/.test(name) ? 0.9 : 1.4));
}
function label(t1, t2, x, z, size) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const g = c.getContext('2d');
  g.textAlign = 'center'; g.fillStyle = 'rgba(27,36,48,0.9)';
  g.font = '600 64px "IBM Plex Sans", system-ui, sans-serif'; g.fillText(t1, 256, 110);
  g.font = '500 52px "IBM Plex Mono", ui-monospace, monospace'; g.fillStyle = 'rgba(27,36,48,0.65)'; g.fillText(t2, 256, 180);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size / 2), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.set(x, 0.01, z);
  return m;
}
scene.add(floors, labels);

// --- brochure underlay (for checking the trace)
const ad = !DATA.img ? { visible: false } : (() => {
  const { src, x0, y0, x1, y1 } = DATA.img;
  const tex = new THREE.TextureLoader().load(src);
  const m = new THREE.Mesh(new THREE.PlaneGeometry((x1 - x0) * M, (y1 - y0) * M), new THREE.MeshBasicMaterial({ map: tex }));
  m.rotation.x = -Math.PI / 2;
  m.position.set((x0 + x1) / 2 * M, 0.005, (y0 + y1) / 2 * M);
  m.visible = false;
  scene.add(m);
  return m;
})();

// --- furniture from Sweet Home 3D (real catalogue models, normalised to a unit cube)
const geoCache = {};
function partGeo(key, i, b64) {
  const id = key + ':' + i;
  if (!geoCache[id]) {
    const bin = atob(b64), q = new Int16Array(bin.length / 2);
    for (let k = 0; k < q.length; k++) q[k] = (bin.charCodeAt(2 * k) | (bin.charCodeAt(2 * k + 1) << 8)) << 16 >> 16;
    const pos = new Float32Array(q.length);
    for (let k = 0; k < q.length; k++) pos[k] = q[k] / 65000;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.computeVertexNormals();
    geoCache[id] = g;
  }
  return geoCache[id];
}
const matCache = {};
function partMat(color, opacity) {
  const id = color + opacity;
  return matCache[id] || (matCache[id] = new THREE.MeshStandardMaterial({
    color, roughness: 0.75, side: THREE.DoubleSide, transparent: opacity < 1, opacity }));
}
const layouts = (FURN ? FURN.layouts : []).map((L) => {
  const g = new THREE.Group();
  for (const p of L.pieces) {
    const parts = FURN.models[p.m] || [];
    const piece = new THREE.Group();
    const body = new THREE.Group();
    parts.forEach(([color, opacity, b64], i) => {
      const m = new THREE.Mesh(partGeo(p.m, i, b64), partMat(p.c || color, opacity));
      m.castShadow = opacity >= 1; m.receiveShadow = true;
      body.add(m);
    });
    body.scale.set(p.w * M * (p.mir ? -1 : 1), p.h * M, p.d * M);
    piece.add(body);
    piece.position.set(p.x * M, (p.el + p.h / 2) * M, p.y * M);
    piece.rotation.y = -p.a * Math.PI / 180;
    g.add(piece);
  }
  g.visible = false;
  scene.add(g);
  return g;
});
let furnIdx = -1;
const furnSeg = document.getElementById('furn-seg');
function setFurn(i) {
  furnIdx = i;
  layouts.forEach((g, k) => { g.visible = k === i; });
  [...furnSeg.children].forEach((b, k) => b.setAttribute('aria-pressed', String(k - 1 === i)));
  labels.visible = mode !== 'walk' && !ad.visible && i < 0;
  try { localStorage.setItem(DATA.key + '-furn', String(i)); } catch (e) {}
}
['Sem móveis', ...(FURN ? FURN.layouts.map((L) => L.label) : [])].forEach((label, k) => {
  const b = document.createElement('button');
  b.textContent = label; b.onclick = () => setFurn(k - 1);
  furnSeg.appendChild(b);
});
furnSeg.hidden = layouts.length === 0;

// --- cameras
const cam = new THREE.PerspectiveCamera(50, 1, 0.05, 200);
const orbit = new THREE.OrbitControls(cam, renderer.domElement);
orbit.enableDamping = true;
orbit.maxPolarAngle = Math.PI / 2 - 0.05;
orbit.target.set(cx, 0, cz);

let mode = 'aerial';
const walker = { x: DATA.start[0] * M, z: DATA.start[1] * M, yaw: Math.PI / 2, pitch: 0 };
const EYE = 1.6, R = 0.25;

const hints = {
  aerial: 'Arrasta para rodar · pinça ou roda para zoom · escala <span class="m">' + DATA.scale.toFixed(2).replace('.', ',') + ' cm/px</span> (aproximada)',
  plan: 'Vista de cima · arrasta para mover · liga “Planta do anúncio” para comparar o traçado',
  walk: matchMedia('(pointer: coarse)').matches
    ? 'Arrasta para os lados para virar · para cima para andar · começas na porta da rua'
    : 'Arrasta para olhar · W A S D ou setas para andar · começas na porta da rua',
};
function setMode(m) {
  mode = m;
  for (const id of ['aerial', 'plan', 'walk']) document.getElementById('v-' + id).setAttribute('aria-pressed', String(id === m));
  document.getElementById('hint').innerHTML = hints[m];
  orbit.enabled = m !== 'walk';
  labels.visible = m !== 'walk' && furnIdx < 0 && !ad.visible;
  if (m === 'aerial') {
    orbit.enableRotate = true; orbit.screenSpacePanning = false;
    cam.position.set(cx - span * 0.45, span * 0.95, cz + span * 0.85);
    orbit.target.set(cx, 0, cz); orbit.update();
  } else if (m === 'plan') {
    orbit.enableRotate = false; orbit.screenSpacePanning = true;
    cam.position.set(cx, span * 1.55, cz + 0.001);
    orbit.target.set(cx, 0, cz); orbit.update();
  } else {
    cam.rotation.order = 'YXZ';
  }
  resize();
}
for (const id of ['aerial', 'plan', 'walk']) document.getElementById('v-' + id).onclick = () => setMode(id);
document.getElementById('t-ad').hidden = !DATA.img;
document.getElementById('t-ad').onclick = (e) => {
  ad.visible = !ad.visible;
  floors.visible = !ad.visible;
  layouts.forEach((g, k) => { g.visible = !ad.visible && k === furnIdx; });
  labels.visible = !ad.visible && mode !== 'walk' && furnIdx < 0;
  e.currentTarget.setAttribute('aria-pressed', String(ad.visible));
};

// --- walk input
const keys = new Set();
addEventListener('keydown', (e) => { if (mode === 'walk') keys.add(e.key.toLowerCase()); });
addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
let drag = null, touchMove = 0;
const coarse = matchMedia('(pointer: coarse)').matches;
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (mode !== 'walk') return;
  drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY };
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (mode !== 'walk' || !drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  walker.yaw -= dx * 0.005;
  if (coarse) touchMove = Math.max(-1, Math.min(1, (drag.sy - e.clientY) / 80));
  else walker.pitch = Math.max(-1.2, Math.min(1.2, walker.pitch - dy * 0.004));
});
const endDrag = () => { drag = null; touchMove = 0; };
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

function collide(x, z) {
  for (let i = 0; i < 2; i++) for (const [x1, z1, x2, z2] of solids) {
    const dx = x2 - x1, dz = z2 - z1, L2 = dx * dx + dz * dz || 1;
    const t = Math.max(0, Math.min(1, ((x - x1) * dx + (z - z1) * dz) / L2));
    const px = x1 + dx * t, pz = z1 + dz * t, d = Math.hypot(x - px, z - pz);
    if (d < R && d > 1e-6) { x = px + (x - px) / d * R; z = pz + (z - pz) / d * R; }
  }
  return [x, z];
}

// --- loop
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); cam.aspect = w / h;
  cam.fov = mode === 'walk' ? (w < h ? 75 : 65) : 50;
  cam.updateProjectionMatrix();
}
addEventListener('resize', resize);
let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode === 'walk') {
    let f = touchMove, s = 0;
    if (keys.has('w') || keys.has('arrowup')) f += 1;
    if (keys.has('s') || keys.has('arrowdown')) f -= 1;
    if (keys.has('a')) s -= 1;
    if (keys.has('d')) s += 1;
    if (keys.has('arrowleft')) walker.yaw += 1.8 * dt;
    if (keys.has('arrowright')) walker.yaw -= 1.8 * dt;
    const sp = 1.4 * dt, fx = -Math.sin(walker.yaw), fz = -Math.cos(walker.yaw);
    [walker.x, walker.z] = collide(walker.x + (fx * f - fz * s) * sp, walker.z + (fz * f + fx * s) * sp);
    cam.position.set(walker.x, EYE, walker.z);
    cam.rotation.set(walker.pitch, walker.yaw, 0, 'YXZ');
  } else orbit.update();
  renderer.render(scene, cam);
});
let saved = layouts.length - 1;
try { const v = localStorage.getItem(DATA.key + '-furn'); if (v !== null && +v < layouts.length) saved = +v; } catch (e) {}
setMode('aerial');
setFurn(saved);
</script>

</body>
</html>
